<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clima LED</title>
<style>
:root{--bg:#000;--fg:#eceef5;--mut:#9aa0b3;--card:#0e0f12;--line:#2a2d36;--on:#eceef5;--onfg:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 32px}
h1{font:700 24px/1.2 "Trebuchet MS","Segoe UI",sans-serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;max-width:62ch}
canvas{display:block;width:100%;aspect-ratio:148/78;cursor:pointer}
.panel{margin-top:16px;display:grid;gap:14px}
.grp{display:grid;gap:6px}
.grp>span{font-size:13px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px;border-radius:999px;min-height:36px}
button:hover{border-color:var(--mut)}
button[aria-pressed="true"]{background:var(--on);color:var(--onfg);border-color:var(--on)}
button:focus-visible,input:focus-visible{outline:2px solid #3d8bff;outline-offset:2px}
input[type=text]{font:inherit;flex:1;min-width:180px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#st{color:var(--mut);font-size:13px;margin:4px 0 0;min-height:20px}
</style>
<style id="hw">html,body{background:transparent!important;margin:0!important;padding:0!important;min-height:0!important;overflow:hidden}main{max-width:none!important;padding:0!important}h1,.sub,.panel{display:none!important}canvas{width:100%}</style></head>
<body>
<main>
<h1>Clima LED</h1>
<p class="sub">El clima en puntos: ahora, próximas horas y próximos días. Toca la pantalla para cambiar de vista.</p>
<canvas id="c" aria-label="Pantalla de puntos LED con el clima"></canvas>
<div class="panel">
  <div class="grp"><span>Vista</span><div class="row" id="views"></div></div>
  <div class="grp"><span>Diseño</span><div class="row" id="dsgs"></div></div>
  <div class="grp"><span>Unidad principal</span><div class="row" id="units"></div></div>
  <div class="grp"><span>Color</span><div class="row" id="themes"></div></div>
  <div class="grp"><span>Probar el clima</span><div class="row" id="wx"></div><div class="row" id="dn"></div></div>
  <div class="grp"><span>Ciudad</span>
    <div class="row"><input type="text" id="q" placeholder="Escribe una ciudad" aria-label="Ciudad"><button type="button" id="go">Buscar</button><button type="button" id="me">Mi ubicación</button></div>
    <p id="st"></p></div>
</div>
</main>
<script>
const COLS=142,ROWS=72,M=3,OX=4,OY=4,LC=67,LM=32,RED='#ff3b30',DIM='#8a8f9c';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),st=document.getElementById('st');
const N=COLS*ROWS,PA=new Array(N),PD=new Array(N),O=new Array(N),H=Array.from({length:N},Math.random);
let B=PA,tm=0,theme='blanco',dsg='card',U='C',force=null,dm='auto',vcur='now',vprev='now',vk=1,autoOn=false,autoT=0,W=null,bg=null;
const TH={blanco:'#f2f4ff',ambar:'#ffb02e',cian:'#3df0ff',verde:'#3dff86'},col=()=>TH[theme];
const NAMES=['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
function px(x,y,c){x=Math.floor(x)+OX;y=Math.floor(y)+OY;if(x<0||x>=COLS||y<0||y>=ROWS)return;B[y*COLS+x]=c}

/* Fuentes de puntos: 3x5 (letras) y 5x7 (cifras) */
const G={};
('0 111101101101111|1 010110010010111|2 111001111100111|3 111001111001111|4 101101111001001|5 111100111001111|6 111100111101111|7 111001001001001|8 111101111101111|9 111101111001111|A 010101111101101|B 110101110101110|C 011100100100011|D 110101101101110|E 111100110100111|F 111100110100100|G 011100101101011|H 101101111101101|I 111010010010111|J 001001001101010|K 101101110101101|L 100100100100111|M 101111111101101|N 110101101101101|O 010101101101010|P 110101110100100|Q 010101101111011|R 110101110101101|S 011100010001110|T 111010010010010|U 101101101101111|V 101101101101010|W 101101111111101|X 101101010101101|Y 101101010010010|Z 111001010100111|° 111101111000000|- 000000111000000|^ 010101101010010|. 000000000000010').split('|').forEach(s=>G[s[0]]=s.slice(2));
const F5='01110/10001/10011/10101/11001/10001/01110|00100/01100/00100/00100/00100/00100/01110|01110/10001/00001/00010/00100/01000/11111|11110/00001/00001/01110/00001/00001/11110|00010/00110/01010/10010/11111/00010/00010|11111/10000/11110/00001/00001/10001/01110|00110/01000/10000/11110/10001/10001/01110|11111/00001/00010/00100/01000/01000/01000|01110/10001/10001/01110/10001/10001/01110|01110/10001/10001/01111/00001/00010/01100'.split('|').map(s=>s.replace(/\//g,''));
F5['-']='0'.repeat(15)+'01110'+'0'.repeat(15);
function gl(c,x,y,cl,s){const g=G[c];if(!g)return;for(let i=0;i<15;i++)if(g[i]==='1')for(let a=0;a<s;a++)for(let b=0;b<s;b++)px(x+(i%3)*s+a,y+((i/3)|0)*s+b,cl)}
function txt(str,x,y,cl,s=1){for(const c of str){gl(c,x,y,cl,s);x+=4*s}}
const tw=(str,s=1)=>str.length*4*s-s,ctr=(str,cx,y,cl,s=1)=>txt(str,Math.round(cx-tw(str,s)/2),y,cl,s);
const bw=(s,p)=>(s.length-1)*6*p+4*p;
function big(str,x,y,cl,p){for(const c of str){const g=F5[c];for(let i=0;i<35;i++)if(g[i]==='1')px(x+(i%5)*p,y+((i/5)|0)*p,(p===2?'!':'@')+cl);x+=6*p}}
const bigc=(str,cx,y,cl,p)=>big(str,Math.round(cx-bw(str,p)/2-(p===2?1:.5)),y,cl,p);
function deg(n,cx,y,cl){const s=''+n,x0=Math.round(cx-(s.length*6+3)/2);let x=x0;for(const c of s){const g=F5[c];for(let i=0;i<35;i++)if(g[i]==='1')px(x+i%5,y+((i/5)|0),cl);x+=6}gl('°',x,y,cl,1)}

/* Clima: códigos WMO de Open-Meteo */
const gk=c=>c<2?'c':c===2?'p':c===3?'o':c<50?'f':c<68?'r':c<78?'s':c<83?'r':c<87?'s':'t';
const desc=c=>({c:c===0?'DESPEJADO':'CASI DESPEJADO',p:'PARCIAL NUBLADO',o:'NUBLADO',f:'NIEBLA',r:c<55?'LLOVIZNA':c>=80?'CHUBASCOS':'LLUVIA',s:'NIEVE',t:'TORMENTA'})[gk(c)];
const BOLT=[[2,0],[3,0],[1,1],[2,1],[0,2],[1,2],[2,2],[1,3],[2,3],[0,4],[1,4]];
function icon(code,day,cx,cy,k){
  const g=gk(code),L='#e8ecf5',DK='#9aa3b5',BL='#4aa8ff',Y='#ffc83d',bob=Math.sin(tm*.9)*.6;
  const d=(x,y,r,c)=>{const R=r*k,n=Math.ceil(R);for(let j=-n;j<=n;j++)for(let i=-n;i<=n;i++)if(i*i+j*j<=R*R+.4)px(cx+x*k+i,cy+y*k+j,c)};
  const rc=(x0,y0,x1,y1,c)=>{for(let j=Math.round(y0*k);j<=Math.round(y1*k);j++)for(let i=Math.round(x0*k);i<=Math.round(x1*k);i++)px(cx+i,cy+j,c)};
  const cl=(x,y,c,s=1)=>{d(x-5*s,y+2*s,3.5*s,c);d(x,y-s,5*s,c);d(x+5*s,y+2*s,3.5*s,c);rc(x-5*s,y+2*s,x+5*s,y+5.5*s,c);rc(x-5*s,y+5.5*s,x+5*s,y+5.5*s,c===L?'#c3cadb':'#7e869a')};
  const sun=(x,y,s)=>{d(x,y,4*s,Y);d(x,y,2*s,'#ffe9a3');for(let i=0;i<8;i++){const a=i*Math.PI/4+tm*.5;for(const q of [5.6,7.2])d(x+Math.sin(a)*q*s,y-Math.cos(a)*q*s,.45,Y)}};
  const moon=(x,y,s)=>{d(x,y,4.5*s,'#dfe6ff');d(x+2.6*s,y-1.6*s,3.8*s,null)};
  if(g==='c'){
    if(day)sun(0,0,1);else{moon(0,0,1);if(Math.sin(tm*3)>0)px(cx+7*k,cy-5*k,'#fff');if(Math.sin(tm*3+2)>0)px(cx-7*k,cy+4*k,'#fff')}
  }else if(g==='p'){day?sun(-3.5,-3.5,.7):moon(-3.5,-3.5,.7);cl(2+bob,2,L)}
  else if(g==='o'){cl(-3,-2,DK,.85);cl(2+bob,1,L)}
  else{
    cl(bob,-3,g==='t'?DK:L);
    if(g==='f')for(let i=0;i<3;i++){const y=4+i*2.4,sh=Math.sin(tm+i*1.7)*2;rc(-6+sh,y,6+sh,y,'#aab2c5')}
    if(g==='r'||g==='t'){const n=g==='t'?3:4;for(let i=0;i<n;i++){const x=(i-(n-1)/2)*4.5+bob,y=3+(tm*5+i*2.3)%6;d(x,y,.5,BL);d(x,y+1.2,.5,BL)}}
    if(g==='s')for(let i=0;i<4;i++)d((i-1.5)*4.5+Math.sin(tm*2+i*1.7)*1.5,3+(tm*1.8+i*1.9)%6,.55,'#fff');
    if(g==='t'&&tm%1.6<1)for(const [bx,by] of BOLT)d(-1.5+bx,1.5+by,.62,Y);
  }
}

/* Datos */
const cn=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z ]/g,'').slice(0,dsg==='circ'?9:14);
const tc=c=>U==='C'?Math.round(c):Math.round(c*1.8+32);
const cur=()=>({t:W.cur.t,code:force===null?W.cur.code:force,day:dm==='auto'?W.cur.day:dm});
function sample(name){
  const h=new Date().getHours(),dy=x=>x>=6&&x<18?1:0,ht=[20,19,18,17,17,18];
  W={city:name,live:false,cur:{t:22,code:2,day:dy(h)},
   hours:[2,3,63,63,3,2].map((code,n)=>({h:(h+1+n)%24,t:ht[n],code,day:dy((h+1+n)%24)})),
   days:[63,3,2,80,2,0].map((code,n)=>({d:new Date(Date.now()+n*864e5).toISOString().slice(0,10),max:[26,25,27,24,26,27][n],min:[16,16,17,15,16,17][n],code}))};
}
async function jget(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}}
async function load(la,lo,name){
  st.textContent='Consultando el clima…';
  try{
    const j=await jget('https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+'&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7');
    const c=j.current,hr=j.hourly,dl=j.daily;let i=hr.time.findIndex(t=>t>c.time);if(i<0)i=0;
    W={city:name,live:true,cur:{t:c.temperature_2m,code:c.weather_code,day:c.is_day},
     hours:Array.from({length:6},(_,n)=>({h:+hr.time[i+n].slice(11,13),t:hr.temperature_2m[i+n],code:hr.weather_code[i+n],day:hr.is_day[i+n]})),
     days:Array.from({length:6},(_,n)=>({d:dl.time[n],max:dl.temperature_2m_max[n],min:dl.temperature_2m_min[n],code:dl.weather_code[n]}))};
    st.textContent='Datos reales de Open-Meteo (API gratis y sin clave).';
  }catch(e){
    sample(name);
    st.textContent='No se pudo conectar con la API desde esta página, así que se muestran datos de ejemplo. Al abrir el archivo en tu propio sitio o app, se conecta solo.';
  }
}
async function find(){
  const q=document.getElementById('q').value.trim();if(!q)return;
  st.textContent='Buscando…';
  try{
    const j=await jget('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=es&format=json'),r=j.results&&j.results[0];
    if(!r){st.textContent='No encontré esa ciudad.';return}
    load(r.latitude,r.longitude,r.name);
  }catch(e){st.textContent='No se pudo buscar la ciudad desde esta página: la conexión a la API está bloqueada aquí.'}
}
function me(){
  if(!navigator.geolocation){st.textContent='Este navegador no permite obtener la ubicación.';return}
  navigator.geolocation.getCurrentPosition(async p=>{
    let n='Mi ubicación';
    try{const j=await jget('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&localityLanguage=es');n=j.city||j.locality||n}catch(e){}
    load(p.coords.latitude,p.coords.longitude,n);
  },()=>{st.textContent='No pude obtener tu ubicación: el permiso fue negado o está bloqueado en esta página.'});
}

/* Vistas */
function tempBlock(t,cx,y,p,C,s){const w=bw(t,p),g0=cx-(w+5+tw('°'+U,s))/2;bigc(t,g0+w/2,y,C,p);txt('°'+U,Math.round(g0+w+5),y,C,s)}
function dNow(){
  const C=col(),c=cur(),t=''+tc(c.t),sec=(U==='C'?Math.round(c.t*1.8+32):Math.round(c.t))+'°'+(U==='C'?'F':'C'),city=cn(W.city);
  if(dsg==='card'){
    gl('^',4,4,RED,1);txt(city,9,4,C);txt(desc(c.code),4,11,DIM);
    icon(c.code,c.day,28,38,1.7);
    tempBlock(t,92,18,2,C,2);
    ctr(sec,92,40,DIM,2);
  }else if(dsg==='big'){
    icon(c.code,c.day,32,32,3);
    tempBlock(t,98,10,3,C,2);
    ctr(sec,98,35,DIM,2);
    const x0=Math.round(98-(4+tw(city))/2);gl('^',x0,50,RED,1);txt(city,x0+4,50,C);
    ctr(desc(c.code),98,57,DIM);
  }else{
    icon(c.code,c.day,LC,13,1.05);
    tempBlock(t,LC,23,2,C,2);
    ctr(sec,LC,39,DIM,2);
    const x0=Math.round(LC-(4+tw(city))/2);gl('^',x0,54,RED,1);txt(city,x0+4,54,C);
  }
  if(!W.live&&dsg!=='circ')txt('EJEMPLO',128-tw('EJEMPLO'),2,DIM);
}
function dList(kind){
  const C=col(),cr=dsg==='circ',n=cr?3:6,pitch=cr?17:22,y=cr?[12,27,38,47]:[10,25,38,47];
  if(!cr){txt(kind==='h'?'PROXIMAS HORAS':'PROXIMOS DIAS',4,2,DIM);gl('^',4,58,RED,1);txt(cn(W.city),9,58,DIM);txt('°'+U,128-tw('°'+U),58,DIM);if(!W.live)txt('EJEMPLO',128-tw('EJEMPLO'),2,DIM)}
  for(let i=0;i<n-1;i++){const sx=Math.round(LC+(i-(n-1)/2+.5)*pitch);for(let yy=9;yy<=53;yy+=2)px(sx,yy,'#2a2d36')}
  for(let i=0;i<n;i++){
    const x=Math.round(LC+(i-(n-1)/2)*pitch);
    if(kind==='h'){
      const it=W.hours[i];ctr((it.h%12||12)+(it.h<12?'AM':'PM'),x,y[0],DIM);
      icon(it.code,it.day,x,y[1],cr?.8:.95);deg(tc(it.t),x,y[2],C);
    }else{
      const it=W.days[i];ctr(i?NAMES[new Date(it.d+'T12:00:00').getDay()]:'HOY',x,y[0],i?DIM:RED);
      icon(it.code,1,x,y[1],cr?.8:.95);deg(tc(it.max),x,y[2],C);deg(tc(it.min),x,y[3],DIM);
    }
  }
}
const draw=v=>v==='now'?dNow():dList(v==='hours'?'h':'d'),VS=['now','hours','days'];
function go(v){if(v!==vcur){vprev=vcur;vcur=v;vk=0}}

/* Controles */
const mark=(id,key)=>[...document.getElementById(id).children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===String(key)));
function mk(id,items,fn){
  const el=document.getElementById(id);
  items.forEach(([key,name],i)=>{
    const b=document.createElement('button');b.type='button';b.textContent=name;b.dataset.k=key;
    b.onclick=()=>{fn(key);mark(id,key)};el.appendChild(b);if(!i)b.setAttribute('aria-pressed',true);
  });
}
mk('views',[['now','Ahora'],['hours','Próximas horas'],['days','Próximos días'],['auto','Automático']],v=>{if(v==='auto'){autoOn=true;autoT=0}else{autoOn=false;go(v)}});
mk('dsgs',[['card','Tarjeta'],['circ','Circular'],['big','Icono grande']],v=>{dsg=v;bg=null});
mk('units',[['C','Celsius °C'],['F','Fahrenheit °F']],v=>U=v);
mk('themes',[['blanco','Blanco'],['ambar','Ámbar'],['cian','Cian'],['verde','Verde']],v=>theme=v);
mk('wx',[['real','Real'],['0','Despejado'],['2','Parcial'],['3','Nublado'],['63','Lluvia'],['95','Tormenta'],['73','Nieve'],['45','Niebla']],v=>force=v==='real'?null:+v);
mk('dn',[['auto','Día o noche real'],['1','Día'],['0','Noche']],v=>dm=v==='auto'?'auto':+v);
document.getElementById('go').onclick=find;document.getElementById('me').onclick=me;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
cv.addEventListener('click',()=>{const nx=VS[(VS.indexOf(vcur)+1)%3];autoOn=false;go(nx);mark('views',nx)});

/* Dibujo */
function rr(g,x,y,w,h,r){g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function makeBg(cw){
  bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
  const g=bg.getContext('2d'),ds=dsg==='circ',ex=OX+LC,ey=OY+LM;
  g.fillStyle='#000';g.fillRect(0,0,bg.width,bg.height);
  g.beginPath();
  if(ds)g.arc((M+ex)*cw,(M+ey)*cw,33.5*cw,0,6.2832);else rr(g,cw,cw,(COLS+4)*cw,(ROWS+4)*cw,5*cw);
  g.fillStyle='#060607';g.fill();g.strokeStyle='#1d1e23';g.lineWidth=cw*.3;g.stroke();
  g.fillStyle='rgba(255,255,255,.1)';g.beginPath();const r=cw*.17;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(ds&&Math.hypot(x+.5-ex,y+.5-ey)>33)continue;
    const cx=(M+x+.5)*cw,cy=(M+y+.5)*cw;g.moveTo(cx+r,cy);g.arc(cx,cy,r,0,6.2832);
  }
  g.fill();
}
const ARCS=[[-84,-14],[-5,88],[98,152],[160,196],[206,262]];
function render(){
  const dpr=window.devicePixelRatio||1,Wd=Math.round(cv.clientWidth*dpr);
  if(Wd&&(cv.width!==Wd||!bg)){cv.width=Wd;cv.height=Math.round(Wd*(ROWS+2*M)/(COLS+2*M));makeBg(cv.width/(COLS+2*M))}
  if(!bg)return;
  const cw=cv.width/(COLS+2*M),r=cw*.4;
  ctx.drawImage(bg,0,0);
  for(let i=0;i<N;i++){
    let c=O[i];if(!c)continue;
    let cx=(M+(i%COLS)+.5)*cw,cy=(M+((i/COLS)|0)+.5)*cw,rd=r;
    if(c[0]==='!'){c=c.slice(1);cx+=cw/2;cy+=cw/2;rd=cw*.8}else if(c[0]==='@'){c=c.slice(1);rd=cw*1.1}
    ctx.fillStyle=c;
    ctx.globalAlpha=.2;ctx.beginPath();ctx.arc(cx,cy,rd*1.7,0,6.2832);ctx.fill();
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(cx,cy,rd,0,6.2832);ctx.fill();
  }
  if(dsg==='circ'){
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.2,cw*.2);ctx.lineCap='round';
    ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=cw*.6;ctx.globalAlpha=.85;
    const ox=(M+OX+LC)*cw,oy=(M+OY+LM)*cw,rot=tm*.05;
    for(const [a,b] of ARCS){ctx.beginPath();ctx.arc(ox,oy,35.6*cw,a*Math.PI/180+rot,b*Math.PI/180+rot);ctx.stroke()}
    ctx.restore();
  }
}
sample('Medellín');
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;
  if(autoOn){autoT+=dt;if(autoT>6.5){autoT=0;go(VS[(VS.indexOf(vcur)+1)%3]);mark('views','auto')}}
