<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mascota de puntos</title>
<style>
:root{--page:#f3f2ef;--ink:#16161a;--btn:#e4e2dc;--btn-on:#16161a;--btn-on-ink:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#111113;--ink:#ececec;--btn:#232327;--btn-on:#fff;--btn-on-ink:#111}}
:root[data-theme="dark"]{--page:#111113;--ink:#ececec;--btn:#232327;--btn-on:#fff;--btn-on-ink:#111}
html{height:100%}
body{margin:0;min-height:100%;padding:16px 0;box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.stage{flex:none;width:min(92vw,560px);aspect-ratio:1;background:#000;border-radius:28px;overflow:hidden;cursor:pointer}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:0;border-radius:999px;padding:9px 18px;background:var(--btn);color:var(--ink);cursor:pointer}
button.on{background:var(--btn-on);color:var(--btn-on-ink)}
p{margin:0;font-size:13px;opacity:.6}
</style>
<style id="hw">html,body{background:transparent!important;margin:0!important;padding:0!important;min-height:0!important;overflow:hidden}body{display:block!important}.bar,p{display:none!important}.stage{width:100%!important;border-radius:0!important}</style></head>
<body>
<div class="stage"><canvas id="c"></canvas></div>
<div class="bar">
  <button data-e="neutral" class="on">Neutral</button>
  <button data-e="happy">Feliz</button>
  <button data-e="sleepy">Sueño</button>
  <button data-e="surprised">Sorpresa</button>
  <button data-e="sad">Triste</button>
  <button data-e="love">Amor</button>
  <button data-e="wink">Guiño</button>
  <button data-e="angry">Enojo</button>
  <button data-e="talking">Hablando</button>
  <button data-e="dance">Baile</button>
  <button data-e="dizzy">Mareado</button>
  <button data-e="cool">Cool</button>
  <button data-e="loading">Carga</button>
  <button id="mus">Música</button>
  <button id="auto" class="on">Auto</button>
</div>
<p>Anillo y fondo</p>
<div class="bar">
  <button id="clean">Neutro total</button>
  <button id="noglare">Sin línea</button>
  <button id="nodots">Sin puntos</button>
  <button data-r="normal" class="on">Normal</button>
  <button data-r="onda">Onda</button>
  <button data-r="giro">Giro</button>
  <button data-r="ondas">Ondas</button>
  <button data-r="chispas">Chispas</button>
  <button data-r="respirar">Respirar</button>
  <button data-r="latido">Latido</button>
  <button data-r="filoso">Filoso</button>
  <button data-r="luna">Luna</button>
</div>
<p>Intensidad del ritmo (música y baile)</p>
<div class="bar">
  <button data-i="bajo">Bajo</button>
  <button data-i="normal" class="on">Normal</button>
  <button data-i="alto">Alto</button>
</div>
<p>Cosméticos y juegos</p>
<div class="bar">
  <button id="hat">Sombrero</button>
  <button id="bored" class="on">Aburrido</button>
  <button id="doSpin">Giro</button>
  <button id="doBall">Pelota</button>
</div>
<p>Toca la mascota para cambiar de expresión · sus ojos siguen el cursor</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const S=640,C=S/2,RC=185,RR=199,N=110;
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=cv.height=S*dpr;
const COLS=8,ROWS=11,P=12.5,TAU=Math.PI*2;
let expr='neutral',music=false,t=0,last=performance.now();
let gx=0,gy=0,tgx=0,tgy=0,nextBlink=2,blinkStart=-9,mouth=0,cheeks=0;
const amps=new Float32Array(N);
let ext=null,extUntil=0;
const eyes=[new Float32Array(COLS*ROWS),new Float32Array(COLS*ROWS)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const shape=(rows,start=0,small=[])=>{
  const m=new Float32Array(COLS*ROWS);
  rows.forEach((d,i)=>{for(let p=0;p<d.length;p+=2)for(let c=d[p];c<=d[p+1];c++)m[(i+start)*COLS+c]=1});
  small.forEach(s=>{for(let c=s[1];c<=s[2];c++)m[s[0]*COLS+c]=s[3]});
  return m;
};
const masks={
  neutral:shape([[1,6],[0,7],[0,7],[0,7],[0,7],[0,7],[0,7],[0,7],[1,6]],0,[[10,1,5,.55]]),
  happy:shape([[1,6],[0,7],[0,7],[0,2,5,7],[0,1,6,7]],2),
  sleepy:shape([[0,7],[1,6]],5),
  round:shape([[2,5],[1,2,5,6],[0,1,6,7],[0,1,6,7],[0,1,3,4,6,7],[0,1,3,4,6,7],[0,1,6,7],[1,2,5,6],[2,5]]),
  sad:shape([[5,7],[3,7],[1,7],[0,7],[0,7],[0,7],[1,6]],2),
  heart:shape([[1,2,5,6],[0,3,4,7],[0,7],[0,7],[1,6],[2,5],[3,4]],2),
  angry:shape([[0,2],[0,4],[0,7],[0,7],[0,7],[0,7],[1,6]],2),
  none:shape([]),
  standby:shape([[3,4]],5),
  shades:(()=>{const m=shape([[0,7],[0,7],[0,7],[1,6],[2,5]],3);for(let r=4;r<=6;r++)for(let c=(r===6?2:1);c<=(r===6?5:6);c++)m[r*COLS+c]=.18;return m})()
};
let AC='255,255,255',BD0='7,4,5',BD1='92,36,42',BD2='14,6,8',CHK='255,45,45';const W=[255,255,255],PINK=[255,95,120],RED=[255,80,70];
const EX={
  neutral:{m:['neutral','neutral'],mouth:null,cheeks:0,col:W,ring:1},
  happy:{m:['happy','happy'],mouth:'smile',cheeks:1,col:W,ring:1},
  sleepy:{m:['sleepy','sleepy'],mouth:'tiny',cheeks:0,col:W,ring:.3},
  surprised:{m:['round','round'],mouth:'o',cheeks:0,col:W,ring:1.4},
  sad:{m:['sad','sad'],mouth:'frown',cheeks:0,col:W,ring:.5},
  love:{m:['heart','heart'],mouth:'smile',cheeks:1,col:PINK,ring:1.2,hot:true},
  wink:{m:['neutral','happy'],mouth:'smile',cheeks:1,col:W,ring:1},
  angry:{m:['angry','angry'],mouth:'flat',cheeks:0,col:RED,ring:1.2,hot:true},
  talking:{m:['neutral','neutral'],mouth:'talk',cheeks:0,col:W,ring:1},
  dizzy:{m:['none','none'],mouth:'wavy',cheeks:0,col:W,ring:.9,wobble:true},
  cool:{m:['shades','shades'],mouth:'smirk',cheeks:0,col:W,ring:1.1,dim:1},
  loading:{m:['standby','standby'],mouth:null,cheeks:0,col:W,ring:1,load:true,dim:.6},
  dance:{m:['happy','happy'],mouth:'smile',cheeks:1,col:W,ring:1.3,dance:true}
};
const ORDER=['neutral','happy','wink','love','surprised','dizzy','sad','angry','cool','talking','dance','sleepy','loading'];
const ecol=[255,255,255];
let mouthKey=null;
const prevV=[new Float32Array(COLS*ROWS),new Float32Array(COLS*ROWS)];
let exprT=-9,loadT=0,flash=0,dimV=1,auto=true,autoT=0;
const ov={zzz:0,dizzy:0,shades:0,load:0};
const MOUTH={
  smile:()=>[[-8,0,.4],[0,0,1],[8,0,.4],[-4,8,.4],[4,8,.4]],
  tiny:()=>[[0,2,.5]],
  o:()=>{const a=[];for(let i=0;i<8;i++){const th=i/8*TAU;a.push([Math.cos(th)*7,6+Math.sin(th)*8,1])}return a},
  frown:()=>[[-12,8,.6],[-6,3,.9],[0,0,1],[6,3,.9],[12,8,.6]],
  flat:()=>[-12,-6,0,6,12].map(x=>[x,4,.9]),
  wavy:()=>[-14,-7,0,7,14].map(x=>[x,4+Math.sin(t*7+x*.35)*3.5,.9]),
  smirk:()=>[[-8,7,.5],[-2,7,.9],[4,6,1],[10,3,1],[14,0,.8]],
  talk:()=>{const n=1+Math.round(Math.abs(Math.sin(t*9))*2),a=[];for(let j=0;j<n;j++){const xs=(n>1&&(j===0||j===n-1))?[-4,4]:[-8,0,8];xs.forEach(x=>a.push([x,j*8,1]))}return a}
};

function setExpression(e){
  if(!EX[e])return;
  eyes.forEach((a,k)=>prevV[k].set(a));
  exprT=t;expr=e;autoT=t;
  if(e==='loading')loadT=t;
  document.querySelectorAll('button[data-e]').forEach(b=>b.classList.toggle('on',b.dataset.e===e));
}
const autoBtn=document.getElementById('auto');
function setAuto(v){auto=v;autoBtn.classList.toggle('on',v)}
document.querySelectorAll('button[data-e]').forEach(b=>b.onclick=()=>{setAuto(false);setExpression(b.dataset.e)});
autoBtn.onclick=()=>setAuto(!auto);
let ringStyle='normal',cleanG=0,cleanD=0,goG=false,goD=false,rotA=0,inten='normal';
const IN={normal:{sp:.86,len:.85,base:.22,th:.62}};
const MI={bajo:.4,normal:1,alto:1.7};
let act=null,rot=0,faceA=1,ballA=0,hatOn=false,hatA=0,bored=true,lastIn=0,lastAct=0,moonA=0;
const BR=30,HAT=['...#####...','...#####...','...#####...','...#===#...','...#####...','###########'];
function startAct(n){
  if(act||expr==='loading')return;
  act={n,t0:t};lastAct=t;
  if(n==='ball'){const a=Math.random()*TAU;act.p=[0,0];act.v=[Math.cos(a)*270,Math.sin(a)*270]}
}
document.getElementById('hat').onclick=e=>{hatOn=!hatOn;e.currentTarget.classList.toggle('on',hatOn)};
document.getElementById('bored').onclick=e=>{bored=!bored;e.currentTarget.classList.toggle('on',bored)};
document.getElementById('doSpin').onclick=()=>startAct('spin');
document.getElementById('doBall').onclick=()=>startAct('ball');
window.addEventListener('pointermove',()=>{lastIn=t});
window.addEventListener('pointerdown',()=>{lastIn=t});
document.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{inten=b.dataset.i;document.querySelectorAll('button[data-i]').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>{ringStyle=b.dataset.r;document.querySelectorAll('button[data-r]').forEach(x=>x.classList.toggle('on',x===b))});
const bG=document.getElementById('noglare'),bD=document.getElementById('nodots'),bC=document.getElementById('clean');
function syncC(){bG.classList.toggle('on',goG);bD.classList.toggle('on',goD);bC.classList.toggle('on',goG&&goD)}
bG.onclick=()=>{goG=!goG;syncC()};
bD.onclick=()=>{goD=!goD;syncC()};
bC.onclick=()=>{const v=!(goG&&goD);goG=goD=v;syncC()};
document.getElementById('mus').onclick=e=>{music=!music;e.currentTarget.classList.toggle('on',music)};
cv.onclick=()=>{setAuto(false);setExpression(ORDER[(ORDER.indexOf(expr)+1)%ORDER.length]);clearTimeout(window.__bk);window.__bk=setTimeout(()=>{if(!window.__hold)setAuto(true)},7000)};
window.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect();
  tgx=clamp((e.clientX-(r.left+r.width/2))/r.width*40,-9,9);
  tgy=clamp((e.clientY-(r.top+r.height/2))/r.height*30,-7,7);
});
/* Para conectar audio real: window.mascot.setSpectrum(arrayDe0a1) */
window.mascot={setExpression,setSpectrum(a){ext=a;extUntil=performance.now()+250;music=true}};

function drawRing(beat){
  const vis=1-cleanD;if(vis<.02)return;
  if(ringStyle==='luna'){drawMoon(vis);return}
  const head=(t*3.2)%TAU-Math.PI/2;
  for(let i=0;i<N;i++){
    const th=i/N*TAU-Math.PI/2;
    let target;
    if(ext&&performance.now()<extUntil){target=clamp((ext[Math.floor(i/N*ext.length)]||0)*Math.min(MI[inten],1.4),0,1)}
    else{
      const idle=.5+.5*Math.sin(t*1.3+i*.37)*Math.sin(t*.7+i*.11+1.3);
      if(EX[expr].load){const d=((head-th)%TAU+TAU)%TAU;target=Math.max(.08,1-d/1.6)}
      else{
        target=clamp(((music||EX[expr].dance)?idle*(.5+(.7*beat-.2)*MI[inten]):idle*.5)*EX[expr].ring,0,1);
        if(ringStyle!=='normal'){
          const p=(t*.9)%1;
          let rv;
          if(ringStyle==='onda')rv=.5+.5*Math.sin(th*4-t*3);
          else if(ringStyle==='giro'){const d=((t*2.2-th)%TAU+TAU)%TAU,d2=((t*2.2+Math.PI-th)%TAU+TAU)%TAU;rv=Math.max(.06,1-Math.min(d,d2)/2.4)}
          else if(ringStyle==='ondas')rv=.85;
          else if(ringStyle==='chispas')rv=Math.pow(.5+.5*Math.sin(t*3+i*12.9898),4)*.95+.05;
          else if(ringStyle==='respirar')rv=.15+.5*(.5+.5*Math.sin(t*1.6));
          else if(ringStyle==='filoso'){
            const st=Math.floor(t*1.6+((i*.618)%1)*2);
            const h1=Math.abs(Math.sin(i*127.1+st*311.7)*43758.5453)%1,h2=Math.abs(Math.sin(i*269.5+st*183.3)*43758.5453)%1;
            const P=IN.normal;rv=h2>P.sp?P.len:P.base+.25*(.5+.5*Math.sin(i*.37+t*1.3));
          }
          else rv=.12+.88*(Math.exp(-Math.pow((p-.1)/.06,2))+.7*Math.exp(-Math.pow((p-.32)/.07,2)));
          const fz=ringStyle==='filoso',mm=fz?[.9,.1]:[.55,.45];target=clamp(rv*Math.max(fz?.7:0,Math.min(1,EX[expr].ring))*(music?Math.max(0,1-(1-mm[0]-mm[1]*beat)*MI[inten]):1),0,1);
        }
      }
    }
    amps[i]+=(target-amps[i])*.25;
    const k=2+Math.round(amps[i]*9);
    const deg=((th*180/Math.PI)+360)%360;
    const hot=EX[expr].hot||(deg>275&&deg<325);
    for(let j=0;j<k;j++){
      if(!(ringStyle==='filoso'&&amps[i]>IN.normal.th)&&Math.abs(Math.sin(i*12.9+j*78.2))<.1)continue;
      const fl=ringStyle==='filoso'&&amps[i]>IN.normal.th;
      const r=fl?214+j*6.2+(i%2)*2:214+j*8.5+j*j*.25+(i%2)*4;
      const sz=fl?Math.max(.5,2.5-j*.27):Math.max(.7,2.3-j*.17);
      const al=(1-j/(k+2)*.6)*vis*(ringStyle==='ondas'?.2+.8*(.5+.5*Math.sin(j*1.1-t*6)):1);
      ctx.fillStyle=(hot&&j>=k-3)?`rgba(255,70,70,${al})`:`rgba(${AC},${al})`;
      const aa=fl?th+Math.sin(i*91.7)*.025:th;
      ctx.beginPath();ctx.arc(C+Math.cos(aa)*r,C+Math.sin(aa)*r,sz,0,TAU);ctx.fill();
    }
  }
}

function drawBody(){
  ctx.save();
  ctx.beginPath();ctx.arc(C,C,RC,0,TAU);ctx.clip();
  ctx.fillStyle=`rgb(${BD0})`;ctx.fillRect(0,0,S,S);
  const g=ctx.createLinearGradient(C,C-RC*.3,C,C+RC);
  g.addColorStop(0,`rgba(${BD1},.95)`);g.addColorStop(1,`rgba(${BD2},.95)`);
  ctx.globalAlpha=1-cleanG;ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(C-RC,C+10);ctx.lineTo(C+RC,C-RC*.62);ctx.lineTo(C+RC,C+RC);ctx.lineTo(C-RC,C+RC);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.09)';
  for(let x=C-RC;x<C+RC;x+=11)for(let y=C-RC;y<C+RC;y+=11)ctx.fillRect(x,y,1.6,1.6);
  ctx.restore();
  ctx.strokeStyle=`rgb(${AC})`;ctx.lineWidth=2.2;
  const rot=rotA;
  [[-2.9,-.55],[-.3,1.4],[1.75,2.35],[2.55,3.2]].forEach(a=>{
    ctx.beginPath();ctx.arc(C,C,RR+(ringStyle==='respirar'?Math.sin(t*1.6)*3:0),a[0]+rot,a[1]+rot);ctx.stroke();
  });
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(C,C,RR-7,0,TAU);ctx.stroke();
}

function drawEyes(o){
  const e=EX[expr];
  for(let q=0;q<3;q++)ecol[q]+=(e.col[q]-ecol[q])*.15;
  dimV+=((e.dim||1)-dimV)*.12;
  const cs=`${ecol[0]|0},${ecol[1]|0},${ecol[2]|0}`;
  ctx.shadowColor=`rgba(${cs},.7)`;ctx.shadowBlur=7;
  for(let k=0;k<2;k++){
    const s=k?1:-1,cur=eyes[k],tg=masks[e.m[k]];
    for(let r=0;r<ROWS;r++){
      const w=clamp(o*5.5-Math.abs(r-5)+1,0,1);
      for(let c=0;c<COLS;c++){
        const i=r*COLS+c;
        const b=clamp((t-exprT-(r*.03+(k?COLS-1-c:c)*.025))/.35,0,1);
        const pu=Math.sin(Math.PI*b),eb=b*b*(3-2*b);
        const tv=tg[k?r*COLS+COLS-1-c:i];
        cur[i]=prevV[k][i]+(tv-prevV[k][i])*eb;
        const v=cur[i]*w;
        if(v<.03)continue;
        const x=C+s*86+(c-(COLS-1)/2)*P+gx,y=C-22+(r-5)*P+gy;
        const gl=expr==='cool'?Math.max(0,1-Math.abs(((t*7)%26)-(c+r*1.2))/1.6)*.9:0;
        ctx.fillStyle=`rgba(${cs},${clamp((.35+.65*v)*dimV+gl+pu*.3,0,1)})`;
        ctx.beginPath();ctx.arc(x,y,5.3*v*(1+pu*.3)+gl*2.2,0,TAU);ctx.fill();
      }
    }
  }
  ctx.shadowBlur=0;
}

function drawFace(beat){
  const e=EX[expr];
  if(mouthKey!==e.mouth){mouthKey=e.mouth;mouth=0}
  cheeks+=(e.cheeks-cheeks)*.15;
  mouth+=((e.mouth?1:0)-mouth)*.15;
  if(cheeks>.03){
    ctx.shadowColor=`rgba(${CHK},.9)`;ctx.shadowBlur=8;
    ctx.fillStyle=`rgba(${CHK},${cheeks})`;
    [-1,1].forEach(s=>{[-4.5,4.5].forEach(dx=>{
      ctx.beginPath();ctx.arc(C+s*112+dx+gx*.5,C+62+gy*.5,4.4,0,TAU);ctx.fill();
    })});
    ctx.shadowBlur=0;
  }
  if(mouth>.03&&mouthKey){
    const sc=music?1+beat*.5*MI[inten]:1;
    MOUTH[mouthKey]().forEach(d=>{
      ctx.fillStyle=`rgba(${ecol[0]|0},${ecol[1]|0},${ecol[2]|0},${d[2]*mouth})`;
      ctx.beginPath();ctx.arc(C+d[0]*sc+gx*.6,C+78+d[1]*sc+gy*.6,3.2*sc,0,TAU);ctx.fill();
    });
  }
}

function drawFlash(){
  if(flash<.02)return;
  ctx.fillStyle=`rgba(255,255,255,${flash*.28})`;
  ctx.beginPath();ctx.arc(C,C,RC,0,TAU);ctx.fill();
  flash*=.92;
}
function drawOverlays(){
  const k=.12,ey=C-22;
  ov.zzz+=((expr==='sleepy'?1:0)-ov.zzz)*k;
  ov.dizzy+=((expr==='dizzy'?1:0)-ov.dizzy)*k;
  ov.shades+=((expr==='cool'?1:0)-ov.shades)*k;
  ov.load+=((expr==='loading'?1:0)-ov.load)*k;
  if(ov.zzz>.02){
    const Z=[[0,0],[1,0],[2,0],[3,0],[4,0],[3,1],[2,2],[1,3],[0,4],[1,4],[2,4],[3,4],[4,4]];
    for(let i=0;i<3;i++){
      const ph=(t*.35+i/3)%1,sc=3+ph*3.2;
      const x0=C+110+ph*45,y0=C-80-ph*120;
      ctx.fillStyle=`rgba(255,255,255,${Math.sin(Math.PI*ph)*ov.zzz})`;
      Z.forEach(p=>{ctx.beginPath();ctx.arc(x0+p[0]*sc,y0+p[1]*sc,sc*.34,0,TAU);ctx.fill()});
    }
  }
  if(ov.dizzy>.02){
    ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=6;
    [0,1].forEach(q=>{
      const s=q?1:-1,dir=q?1:-1,cx=C+s*86+gx,cy=ey+gy;
      for(let n=0;n<46;n++){
        const th=n*.38+t*5*dir,r=2+n*.95;
        ctx.fillStyle=`rgba(255,255,255,${ov.dizzy*(1-n/62)})`;
        ctx.beginPath();ctx.arc(cx+Math.cos(th)*r,cy+Math.sin(th)*r,2.8-n*.03,0,TAU);ctx.fill();
      }
    });
    ctx.shadowBlur=0;
  }
  if(ov.shades>.02){
    ctx.fillStyle=`rgba(255,255,255,${ov.shades*.9})`;
    [-25,-12.5,0,12.5,25].forEach(x=>{ctx.beginPath();ctx.arc(C+x+gx,ey-25+gy,4.2,0,TAU);ctx.fill()});
    [-1,1].forEach(s=>[134,146,158,170].forEach(x=>{ctx.beginPath();ctx.arc(C+s*x+gx,ey-25+gy,3.2,0,TAU);ctx.fill()}));
  }
  if(ov.load>.02){
    const p=clamp((t-loadT)/3.2,0,1),n=10,f=Math.floor(p*n);
    for(let i=0;i<n;i++){
      const on=i<f||(i===f&&Math.sin(t*14)>0);

function stepAct(dt){

function drawHat(){

function drawMoon(vis){

    ctx.beginPath();ctx.arc(mx+x,my+y,1.9,0,TAU);ctx.fill();
  }

}
function frame(now){

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,S,S);
  cleanG+=((goG?1:0)-cleanG)*.08;cleanD+=((goD?1:0)-cleanD)*.08;
  rotA+=(ringStyle==='giro'?.9:.05)*dt;moonA+=.8*dt;
  const wb=EX[expr].wobble?1:0,dn=EX[expr].dance?1:0,fr=1-wb-dn,moon=ringStyle==='luna'&&cleanD<.5;
  stepAct(dt);

  gy+=(((moon?Math.sin(moonA)*7:tgy)*fr+Math.cos(t*.5)*1.5+wb*Math.cos(t*2.6)*6-dn*Math.abs(Math.cos(t*5.97))*8)-gy)*.1;

  drawBody();
  drawFlash();

  drawBall();
  drawHat();
  requestAnimationFrame(frame);
}
setAuto(true);setExpression('loading');
requestAnimationFrame(frame);
</script>
