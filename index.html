  <body>
    <div id="root"></div>
    <div id="boot" style="display:none;max-width:26rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui;text-align:center;color:#fafafa">
      <p style="font-weight:700">Hermes no arrancó en este navegador</p>
      <pre id="boot-err" style="display:none;font-size:.7rem;text-align:left;white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.07);padding:.6rem;border-radius:.6rem;max-height:12rem;overflow-y:auto"></pre>
      <p style="font-size:.85rem;opacity:.7">Prueba recargar. Si sigue igual, abre con <b>?seguro=1</b> al final de la dirección (arranca sin tus datos) o borra los datos del sitio en ajustes del navegador.</p>
      <button onclick="try{localStorage.clear()}catch(e){};location.reload()" style="margin-top:1rem;padding:.6rem 1.2rem;border-radius:.8rem;border:0;background:#6366f1;color:#fff">Reintentar limpio</button>
    </div>
    <script>
      (function () {
        var errs = [];
        function show(msg) {
          try {
            errs.push(String(msg).slice(0, 300));
            var b = document.getElementById('boot');
            var p = document.getElementById('boot-err');
            if (b) b.style.display = 'block';
            if (p) { p.style.display = 'block'; p.textContent = errs.slice(-4).join('\n---\n'); }
          } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          if (e && (e.filename || e.message)) show('Error: ' + (e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '?'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show('Promesa: ' + String((e && e.reason && (e.reason.message || e.reason)) || e).slice(0, 200));
        });
        setTimeout(function () {
          try { if (!document.getElementById('root').hasChildNodes()) show('La app no montó (root vacío tras 9s)'); } catch (e) {}
        }, 9000);
      })();
    </script>
    <noscript><main style="max-width:42rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui"><h1>Hermes – Panel personal</h1><p>Hermes es tu panel personal con clima, música, radios, recordatorios, notas y atajos. Activa JavaScript para usar la app.</p></main></noscript>
